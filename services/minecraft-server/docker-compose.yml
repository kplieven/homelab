services:
  mc:
    image: itzg/minecraft-server
    container_name: mc
    ports:
      - '${PORT:-25565}:25565'
    volumes:
      - './data:/data'
    environment:
      - EULA=true
      - TZ=${TZ}
    labels:
      # No homepage.href: Minecraft has no web UI to link to.
      - homepage.group=Games
      - homepage.name=Minecraft
      - homepage.icon=minecraft
    mem_limit: ${MEM_LIMIT:-1500m}
    restart: unless-stopped

