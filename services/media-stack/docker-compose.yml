services:
  prowlarr:
    image: lscr.io/linuxserver/prowlarr
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    volumes:
      - './prowlarr/config:/config'
    ports:
      - '9696:9696'
    labels:
      - homepage.group=Media
      - homepage.name=Prowlarr
      - homepage.icon=prowlarr
      - homepage.href=${PROWLARR_URL}
      - homepage.widget.type=prowlarr
      - homepage.widget.url=${PROWLARR_URL}
      - homepage.widget.key=${PROWLARR_API_KEY}
    restart: unless-stopped
  sonarr:
    container_name: sonarr
    image: lscr.io/linuxserver/sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    ports:
      - '8989:8989'
    volumes:
      - './sonarr/config:/config'
      - '${MEDIA_ROOT}:/data/media'
      - '${TORRENT_ROOT}:/data/torrents'
    labels:
      - homepage.group=Media
      - homepage.name=Sonarr
      - homepage.icon=sonarr
      - homepage.href=${SONARR_URL}
      - homepage.widget.type=sonarr
      - homepage.widget.url=${SONARR_URL}
      - homepage.widget.key=${SONARR_API_KEY}
    restart: unless-stopped
  radarr:
    container_name: radarr
    image: lscr.io/linuxserver/radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    ports:
      - '7878:7878'
    volumes:
      - './radarr/config:/config'
      - '${MEDIA_ROOT}:/data/media'
      - '${TORRENT_ROOT}:/data/torrents'
    labels:
      - homepage.group=Media
      - homepage.name=Radarr
      - homepage.icon=radarr
      - homepage.href=${RADARR_URL}
      - homepage.widget.type=radarr
      - homepage.widget.url=${RADARR_URL}
      - homepage.widget.key=${RADARR_API_KEY}
    restart: unless-stopped
  bazarr:
    container_name: bazarr
    image: lscr.io/linuxserver/bazarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    volumes:
      - './bazarr/config:/config'
      - '${MEDIA_ROOT}:/data/media'
      - '${TORRENT_ROOT}:/data/torrents'
    ports:
      - '6767:6767'
    labels:
      - homepage.group=Media
      - homepage.name=Bazarr
      - homepage.icon=bazarr
      - homepage.href=${BAZARR_URL}
      - homepage.widget.type=bazarr
      - homepage.widget.url=${BAZARR_URL}
      - homepage.widget.key=${BAZARR_API_KEY}
    restart: unless-stopped
  jellyfin:
    container_name: jellyfin
    image: lscr.io/linuxserver/jellyfin
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    ports:
      - '8096:8096'
    volumes:
      - './jellyfin/config:/config'
      - '${MEDIA_ROOT}:/data/media'
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - '992'   # render
      - '44'    # video
    labels:
      - homepage.group=Media
      - homepage.name=Jellyfin
      - homepage.icon=jellyfin
      - homepage.href=${JELLYFIN_URL}
      - homepage.version=2
      - homepage.widget.type=jellyfin
      - homepage.widget.url=${JELLYFIN_URL}
      - homepage.widget.key=${JELLYFIN_API_KEY}
    restart: unless-stopped
  qbittorrent:
    container_name: qbittorrent
    image: lscr.io/linuxserver/qbittorrent:latest
    # gluetun lives in services/gluetun. The service: form only resolves
    # within one compose project, so address the container directly.
    # Start services/gluetun first; if gluetun is ever recreated, run
    # services/gluetun/restart-dependents.sh or this container keeps a
    # dead namespace and silently loses all network.
    network_mode: "container:gluetun"
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=002
      - TZ=${TZ}
      - WEBUI_PORT=8080
    volumes:
      - './qbittorrent/config:/config'
      - '${TORRENT_ROOT}:/data/torrents'
    labels:
      - homepage.group=Download
      - homepage.name=QBitTorrent
      - homepage.icon=qbittorrent
      - homepage.href=${QBITTORRENT_URL}
      - homepage.widget.type=qbittorrent
      - homepage.widget.url=${QBITTORRENT_URL}
      - homepage.widget.username=${QBITTORRENT_USERNAME}
      - homepage.widget.password=${QBITTORRENT_PASSWORD}
    restart: unless-stopped
  flaresolverr:
    container_name: flaresolverr
    image: ghcr.io/flaresolverr/flaresolverr:latest
    ports:
      - '8191:8191'
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    restart: unless-stopped
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    container_name: seerr
    environment:
      - LOG_LEVEL=debug
      - TZ=${TZ}
      - PORT=5055 #optional
    ports:
      - '5055:5055'
    volumes:
      - './jellyseerr/config:/app/config'
    labels:
      - homepage.group=Media
      - homepage.name=Seerr
      - homepage.icon=seerr
      - homepage.href=${JELLYSEERR_URL}
      - homepage.widget.type=jellyseerr
      - homepage.widget.url=${JELLYSEERR_URL}
      - homepage.widget.key=${JELLYSEERR_API_KEY}
    restart: unless-stopped
